<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DiffDeck — side-by-side text diff in the browser</title>
<meta name="description" content="Compare two blocks of text side by side with word-level highlighting, collapsible unchanged regions and unified-diff export.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='12'>&#177;</text></svg>">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <h1>DiffDeck</h1>
  <div class="summary" id="summary"></div>
  <div class="controls">
    <div class="seg" role="group" aria-label="View mode">
      <button data-view="split" class="active">Split</button>
      <button data-view="unified">Unified</button>
      <button data-view="patch">Patch</button>
    </div>
    <label class="check"><input type="checkbox" id="ws"> ignore whitespace</label>
    <label class="check"><input type="checkbox" id="case"> ignore case</label>
    <label class="check"><input type="checkbox" id="collapse" checked> collapse unchanged</label>
    <button id="swap" class="ghost">Swap</button>
    <button id="sample" class="ghost">Sample</button>
  </div>
</header>

<section class="inputs" id="inputs">
  <label class="io">
    <span>Original</span>
    <textarea id="left" spellcheck="false"></textarea>
  </label>
  <label class="io">
    <span>Changed</span>
    <textarea id="right" spellcheck="false"></textarea>
  </label>
</section>

<main id="output" class="output"></main>

<footer>
  <button id="toggle-inputs" class="ghost">Hide editors</button>
  <button id="copy-patch" class="ghost">Copy unified patch</button>
  <span class="dim">Everything runs locally — nothing is uploaded.</span>
</footer>

<script src="js/diff.js"></script>
<script src="js/app.js"></script>
</body>
</html>
